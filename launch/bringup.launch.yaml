# Unity (OperaSim-PhysX) 用の bringup。上流の docker/launch/bringup.launch.yaml を include し、
# zx200_ros2 main (de7ab607 以降) が前提とする次の 2 点を足す:
#   - /zx200/joint_states (Unity) を /zx200/front_joint_states へ中継する pubFrontJointState.py
#     (vehicle.launch.py が joint_states を front_joint_states に remap するが、上流の launch は中継を起動しない)
#   - use_sim_time:=true (joint_state_broadcaster が外れ、Unity の時刻付きの関節状態をそのまま使うため)
# task_id / command_interface_name / use_rviz / tms_if_delay / tms_ts_delay は
# 上流の bringup の引数で、コマンドラインで渡せば include 先に届く (例: task_id:=2)。
launch:
  - arg:
      name: use_sim_time
      default: "true"
      description: "Use the /clock published by Unity"

  - node:
      pkg: zx200_unity
      exec: pubFrontJointState.py
      output: screen

  - include:
      file: /workspace/src/ros2_tms_for_construction/docker/launch/bringup.launch.yaml
      arg:
        - name: use_sim_time
          value: $(var use_sim_time)
